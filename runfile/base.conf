##################################################################
##      Job Description                                         ##
##################################################################
#Minimization and Equilibration: For USDA project
#Object: haotian's output

##################################################################
##      Adjuatable Parameters                                   ##
##################################################################
set name                2f4j_k_solv

set a                   87                ;# xlength of water box
set b                   87                ;# ylength of water box
set c                   87                ;# zlength of water box

set freq                25000             ;# Number of timesteps (10ps)
#set paramdir            /storage/home/hhive1/lyang403/data/ParamFiles
set paramdir            /storage/home/hcoda1/9/lyang403/p-jcgumbart-0/ParamFiles
#set paramdir            /localdata/lyang403/Scriptlib/prm/ParamFiles
##################################################################
##      SIMULATION PARAMETERS                                   ##
##################################################################

# Force Field Parameter File
paraTypeCharmm          on
parameters              $paramdir/toppar_water_ions_modified.prm
parameters              $paramdir/par_all36m_prot.prm
parameters              $paramdir/NBFIX.str

#Get frst timestep
proc get_first_ts { xscfile } {
  set fd [open $xscfile r]
  gets $fd
  gets $fd
  gets $fd line
  set ts [lindex $line 0]
  close $fd
  return $ts
}

#Input
structure               ../../input/${name}.psf
coordinates             ../../input/${name}.pdb
firsttimestep           0
set temperature         300
set outputname          ../out/$name


# Periodic Boundary Conditions:
cellBasisVector1        $a      0.0     0.0     ;# 1A longer
cellBasisVector2        0.0     $b      0.0
cellBasisVector3        0.0     0.0     $c
cellOrigin              -0.09171120822429657 -0.00997208058834076 -0.029404986649751663                    ;# Gained from VMD
wrapAll                 on
wrapNearest             on

# Force-Field Parameters
exclude                 scaled1-4
1-4scaling              1.0
cutoff                  12.0
switching               on
switchdist              10.0
pairlistdist            14.0
vdwForceSwitching       on

# Integrator Parameters
timestep                4
rigidBonds              all
nonbondedFreq           1
fullElectFrequency      2
stepspercycle           10

#PME (for full-system periodic electrostatics)
PME                     yes
PMEGridSpacing          1.0

# Constant Temperature Control
langevin                on                      ; # do langevin dynamics
langevinDamping         1                       ; # damping coefficient (gamma) of 5/ps
langevinTemp            300


# Constant Pressure Control (variable volume)
useGroupPressure        no                     ; # needed for 2fs steps
useFlexibleCell         no                     ; # no for water box, yes for membrane
useConstantArea         no

langevinPiston          on
langevinPistonTarget    1.01325
langevinPistonPeriod    100.0
langevinPistonDecay     50.0
langevinPistonTemp      $temperature

# Output
outputName              $outputname
restartfreq             $freq
dcdfreq                 $freq
xstFreq                 $freq
outputEnergies          5000
outputPressure          5000

temperature             $temperature
###################################################################
##      EXECUTION SCRIPT                                         ##
###################################################################
minimize                200
reinitvels              300
run                     500000000
                                           
